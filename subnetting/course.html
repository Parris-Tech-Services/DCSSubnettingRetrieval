<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCS subnetting | Retrieval sprint</title><style>body{font:16px system-ui;margin:0;background:#eef7f5;color:#153431}main{max-width:850px;margin:auto;padding:22px}.hero{background:#155e59;color:#fff;padding:28px;border-radius:18px}.card{background:#fff;border:1px solid #c8e1dc;border-radius:16px;padding:22px;margin:16px 0}.question{font-size:22px;font-weight:750}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #a5c9c2}button{cursor:pointer;font-weight:700;background:#fff}button.primary{background:#0d756d;color:#fff}.good{background:#e1f7ec;color:#145b3d;padding:12px;border-radius:10px}.bad{background:#fff0e7;color:#873c22;padding:12px;border-radius:10px}.meter{height:10px;background:#d7ebe7;border-radius:10px}.meter i{display:block;height:100%;background:#e28a36;border-radius:10px;width:0}.small{color:#55736e;font-size:14px}</style></head><body><main><header class="hero"><p>RETRIEVAL SPRINT · DCS PROFESSIONAL DEVELOPMENT</p><h1>Recall the subnet, don’t reread it</h1><p>Answer from memory before revealing feedback. Missed cards return to the review queue, and your next-session date is saved locally.</p></header><section class="card"><p id="count" class="small"></p><div class="meter"><i id="meter"></i></div><p id="q" class="question"></p><div class="row"><input id="a" autocomplete="off" placeholder="Type the answer"><button class="primary" id="check">Recall answer</button><button id="reveal">Reveal</button></div><p id="out" aria-live="polite"></p><button id="next" class="primary" hidden>Next card</button></section><section class="card"><h2>Spaced review</h2><p id="schedule" class="small"></p><button id="clear">Reset local review history</button></section><script>var cards=[['How many usable hosts are in /26?','62'],['What mask matches /26?','255.255.255.192'],['Network address of 192.168.10.77/26?','192.168.10.64'],['Broadcast of 10.20.4.14/30?','10.20.4.15'],['What prefix fits 50 usable hosts?','/26'],['What is VLSM?','different subnet sizes for different requirements']],i=0,score=0,done=false,key='dcs-retrieval-subnet-v1',state=JSON.parse(localStorage.getItem(key)||'{"seen":0,"missed":0}');function save(){localStorage.setItem(key,JSON.stringify(state));schedule.textContent='Seen '+state.seen+' cards · missed '+state.missed+' · next review: '+new Date(Date.now()+86400000).toLocaleDateString()}function show(){done=false;var c=cards[i%cards.length];q.textContent=c[0];a.value='';a.disabled=false;check.disabled=false;reveal.disabled=false;next.hidden=true;out.className='';count.textContent='Card '+(i%cards.length+1)+' of '+cards.length+' · score '+score;meter.style.width=(i%cards.length/cards.length*100)+'%'}function grade(reveal){if(done)return;var want=cards[i%cards.length][1],got=a.value.trim().toLowerCase(),ok=got===want.toLowerCase()||want.indexOf('different')>=0&&got.indexOf('different')>=0;done=true;state.seen++;if(!ok)state.missed++;if(ok&&!reveal)score++;save();out.className=ok&&!reveal?'good':'bad';out.textContent=ok&&!reveal?'Correct — retrieval strengthens the memory.':'Answer: '+want+'. Write it once from memory, then continue.';a.disabled=true;check.disabled=true;reveal.disabled=true;next.hidden=false}check.onclick=function(){grade(false)};reveal.onclick=function(){grade(true)};next.onclick=function(){i++;show()};clear.onclick=function(){localStorage.removeItem(key);state={seen:0,missed:0};save()};save();show();</script></body></html>
